name: Compilar

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y empaquetar
        run: ./mvnw -B verify
